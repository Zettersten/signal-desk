name: Desktop evaluation and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  bundles:
    needs: verify
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-26, target: aarch64-apple-darwin, extension: dmg }
          - { runner: macos-26-intel, target: x86_64-apple-darwin, extension: dmg }
          - { runner: windows-2025, target: x86_64-pc-windows-msvc, extension: exe }
          - { runner: ubuntu-26.04, target: x86_64-unknown-linux-gnu, extension: AppImage }
          - { runner: ubuntu-26.04-arm, target: aarch64-unknown-linux-gnu, extension: AppImage }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
      - run: bun install --frozen-lockfile
        working-directory: research
      - name: Compile and smoke-test embedded OpenCode
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RUNNER_PLATFORM: ${{ runner.os }}
        run: |
          bun research/build.ts "$TARGET"
          sidecar="src-tauri/binaries/signal-research-$TARGET"
          if [ "$RUNNER_PLATFORM" = "Windows" ]; then sidecar="$sidecar.exe"; fi
          "./$sidecar" --self-test
          bun research/smoke.ts "$sidecar"
      - name: Build desktop bundle
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri -- build --target "$TARGET" --config src-tauri/with-research.json -- --locked
      - uses: actions/upload-artifact@v7
        with:
          name: signal-desk-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**/*.${{ matrix.extension }}
          if-no-files-found: error

  publish:
    needs: bundles
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: signal-desk-*
          path: release
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "v$(node -p 'require("./package.json").version')"
          mapfile -d '' files < <(find release -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' \) -print0)
          test "${#files[@]}" -eq 5
          gh release create "$TAG" --verify-tag --draft --generate-notes "${files[@]}"
