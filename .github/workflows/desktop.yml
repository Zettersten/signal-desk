name: Desktop evaluation and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  bundles:
    needs: verify
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-26, target: aarch64-apple-darwin }
          - { runner: macos-26-intel, target: x86_64-apple-darwin }
          - { runner: windows-2025, target: x86_64-pc-windows-msvc }
          - { runner: ubuntu-26.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-26.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
      - run: bun install --frozen-lockfile
        working-directory: research
      - name: Compile embedded OpenCode
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bun research/build.ts "$TARGET"
      - name: Verify embedded OpenCode with the inference fixture
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RUNNER_PLATFORM: ${{ runner.os }}
        run: |
          sidecar="src-tauri/binaries/signal-research-$TARGET"
          if [ "$RUNNER_PLATFORM" = "Windows" ]; then sidecar="$sidecar.exe"; fi
          "./$sidecar" --self-test
          bun research/smoke.ts "$sidecar"
      - name: Build desktop bundle
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SIGNED_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          APPLE_CERTIFICATE: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_TEAM_ID || '' }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          args=(--target "$TARGET" --config src-tauri/with-research.json)
          stage=()
          if [ "$SIGNED_RELEASE" = true ]; then
            node scripts/release.mjs config src-tauri/.updater-release.json
            args+=(--config src-tauri/.updater-release.json)
            stage+=(--signed)
            if [ "$RUNNER_OS" = macOS ]; then args+=(--bundles "app,dmg"); fi
          else
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          npm run tauri -- build "${args[@]}" -- --locked
          node scripts/release.mjs stage "$TARGET" "src-tauri/target/$TARGET/release/bundle" staged "${stage[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: signal-desk-${{ matrix.target }}
          path: staged/*
          if-no-files-found: error

  publish:
    needs: bundles
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          pattern: signal-desk-*
          path: release
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node scripts/release.mjs manifest release release/latest.json
          gh release create "$TAG" --verify-tag --draft --generate-notes release/latest.json release/signal-desk-*/*
